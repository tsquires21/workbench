<meta charset="utf-8">
<title>W2972 Bench Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================
   Tokens. Bare :root carries the COMPLETE light palette.
   Dark redefines tokens only - never component rules.
   ============================================================ */
:root{
  --bg:#E9EBEE;
  --surface:#FFFFFF;
  --surface-2:#F1F3F6;
  --surface-3:#E3E7EC;
  --ink:#16181C;
  --ink-2:#5B6472;
  --ink-3:#858E9B;
  --line:#D2D8DF;
  --line-2:#BFC7D1;

  --accent:#C9880A;          /* signal yellow, deepened for light-ground contrast */
  --accent-bright:#F2B705;   /* the housing yellow itself */
  --accent-soft:#FBEFD2;
  --on-accent:#1A1204;

  --hazard:#B4291F;
  --hazard-soft:#FBE9E7;
  --ok:#1F7A55;
  --ok-soft:#E2F3EB;

  /* physical object - near-constant across themes */
  --lcd-bg:#A8B79A;
  --lcd-off:#9AA88D;
  --lcd-ink:#14180F;
  --body-yellow:#F2B705;
  --body-yellow-dk:#D19A04;
  --body-dark:#26282C;
  --body-dark-2:#15171A;
  --metal:#B9BEC6;

  --r-sm:4px; --r-md:8px; --r-lg:14px;
  --shadow:0 1px 2px rgba(16,20,26,.07), 0 6px 20px -8px rgba(16,20,26,.22);

  --font-ui:"Barlow Semi Condensed",'Arial Narrow',system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316;
    --surface:#1B1D21;
    --surface-2:#232629;
    --surface-3:#2C3035;
    --ink:#E8EAED;
    --ink-2:#9AA3AF;
    --ink-3:#727C89;
    --line:#33373E;
    --line-2:#434952;
    --accent:#F2B705;
    --accent-bright:#F2B705;
    --accent-soft:#332703;
    --on-accent:#12130F;
    --hazard:#FF7A6D;
    --hazard-soft:#33170F;
    --ok:#4CC38A;
    --ok-soft:#0F2A1F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1B1D21; --surface-2:#232629; --surface-3:#2C3035;
  --ink:#E8EAED; --ink-2:#9AA3AF; --ink-3:#727C89; --line:#33373E; --line-2:#434952;
  --accent:#F2B705; --accent-bright:#F2B705; --accent-soft:#332703; --on-accent:#12130F;
  --hazard:#FF7A6D; --hazard-soft:#33170F; --ok:#4CC38A; --ok-soft:#0F2A1F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--font-ui); text-wrap:balance; margin:0; line-height:1.15}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}

/* ============================================================
   Shell - vertical split. Meter left, briefing right.
   ============================================================ */
.app{
  display:grid; grid-template-columns:minmax(300px,44%) 1fr;
  min-height:100vh; max-width:1500px; margin:0 auto;
}
.stage{
  background:linear-gradient(180deg,var(--surface-3),var(--bg));
  border-right:1px solid var(--line);
  padding:20px 16px 28px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.panel{padding:20px 22px 60px; display:flex; flex-direction:column; gap:16px; min-width:0}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .stage{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); padding:14px 12px 18px}
  .panel{padding:16px 14px 60px}
  #meter{max-width:286px}
}

/* ============================================================
   Meter artwork
   ============================================================ */
#meter{width:100%; max-width:332px; height:auto; display:block; filter:drop-shadow(0 12px 28px rgba(0,0,0,.28))}
.knob-grp{transform-box:view-box; transform-origin:190px 480px; transition:transform .55s cubic-bezier(.34,1.3,.5,1)}
.jack-ring{opacity:0; transition:opacity .3s}
.jack-ring.on{opacity:1; animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6} 50%{opacity:1}}
.dial-label{font-family:var(--font-ui); font-weight:600; fill:#D8DCE2}
.dial-label.hot{fill:var(--body-yellow); font-weight:700}
.tick{transition:fill .3s}
.tick.hot{fill:var(--body-yellow)}
.arc-label{font-family:var(--font-ui); font-weight:700; font-size:11px; letter-spacing:.1em; fill:#9DA5B0}
.dial-grp-arc{opacity:.85}
.lead{transition:d .45s ease, opacity .3s}
.seg{fill:var(--lcd-ink)}
.seg.off{fill:var(--lcd-off)}
.lcd-unit{font-family:var(--font-ui); font-size:15px; font-weight:700; fill:var(--lcd-ink); opacity:.8; text-anchor:end}
.lcd-badge{font-family:var(--font-ui); font-size:9.5px; font-weight:700; letter-spacing:.09em; fill:var(--lcd-ink); opacity:.45}
.jack-label{font-family:var(--font-ui); font-size:13px; font-weight:700; letter-spacing:.03em; fill:#EDEFF2}
@media (prefers-reduced-motion:reduce){
  .knob-grp{transition:none}
  .jack-ring.on{animation:none}
  .lead{transition:none}
}

/* setup strip under the meter */
.setup{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:100%; max-width:340px}
.chip{
  display:inline-flex; align-items:baseline; gap:6px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:100px; padding:4px 11px; font-family:var(--font-ui);
  font-size:13px; font-weight:600; letter-spacing:.02em;
}
.chip b{font-family:var(--font-mono); font-size:12px; font-weight:600}
.chip.red{border-color:#C4433A; color:#C4433A}
.chip.blk{border-color:var(--ink-2); color:var(--ink-2)}
.chip.dial{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

.unverified{
  width:100%; max-width:340px; font-size:11.5px; line-height:1.4;
  background:var(--hazard-soft); color:var(--hazard);
  border:1px solid currentColor; border-radius:var(--r-md);
  padding:7px 10px; font-family:var(--font-ui); font-weight:600;
}

/* ============================================================
   Panel chrome
   ============================================================ */
.masthead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
.masthead h1{font-size:25px; font-weight:700; letter-spacing:-.01em}
.masthead p{margin:2px 0 0; color:var(--ink-2); font-size:13.5px}
.eyebrow{
  font-family:var(--font-ui); font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
}

.segmented{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); padding:3px}
.segmented button{
  flex:1; border:0; background:transparent; padding:7px 10px; cursor:pointer;
  font-family:var(--font-ui); font-weight:600; font-size:14px; letter-spacing:.02em;
  border-radius:var(--r-sm); color:var(--ink-2);
}
.segmented button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.hit{cursor:pointer}
.hit:hover .dial-label{fill:var(--accent-bright)}
.hit:focus-visible{outline:none}
#btnPower.active circle:first-child{stroke:#FFF3C4; stroke-width:3}
#btnHold.active circle{fill:#6E8BEE; stroke:#FFF}
.pt-logo{font-family:var(--font-ui); font-size:30px; font-weight:700; font-style:italic; fill:#C9CDD4; letter-spacing:-.02em}
.btn-label{font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:.08em; fill:#D6DAE0}
.jack-sub{font-family:var(--font-ui); font-size:8.6px; font-weight:600; letter-spacing:.02em; fill:#C7CCD3}

.verdict{margin:0; width:100%; max-width:404px; font-size:13.5px; line-height:1.45;
  border-left:3px solid var(--ink-3); padding:4px 0 4px 11px; color:var(--ink-2)}
.verdict em{display:block; color:var(--hazard); font-style:normal; font-weight:600; margin-top:3px}
.verdict.good{border-color:var(--ok); color:var(--ink)}
.verdict.warn{border-color:var(--accent); color:var(--ink)}
.verdict.bad{border-color:var(--hazard); color:var(--hazard); font-weight:600}
.fuses[hidden]{display:none}
.fuses{width:100%; max-width:404px; background:var(--hazard-soft); color:var(--hazard);
  border:1px solid currentColor; border-radius:var(--r-md); padding:9px 11px; font-size:13px;
  display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.bench{display:flex; gap:10px; width:100%; max-width:404px; align-items:flex-end; flex-wrap:wrap}
.fld{flex:1; min-width:170px; display:flex; flex-direction:column; gap:3px}
.fld span{font-family:var(--font-ui); font-size:10.5px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3)}
.fld select{width:100%; font:inherit; font-size:14px; padding:8px 10px; background:var(--surface);
  color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r-md)}
.moving{border:1px solid var(--line-2); border-radius:var(--r-md); padding:2px 9px 6px; margin:0; background:var(--surface)}
.moving legend{font-family:var(--font-ui); font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); padding:0 4px}
.moving label{font-size:13.5px; margin-right:7px; cursor:pointer}
.hint{margin:0; width:100%; max-width:404px; font-size:12px; color:var(--ink-3); line-height:1.45}
.view[hidden]{display:none}
.view{display:flex; flex-direction:column; gap:14px; min-width:0}

/* ============================================================
   The briefing - the "what to expect" side
   ============================================================ */
.brief-head{display:flex; flex-direction:column; gap:5px}
.brief-head h2{font-size:22px; font-weight:700}
.brief-head .why{color:var(--ink-2); font-size:14.5px; max-width:64ch}

.block{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.block > h3{
  font-family:var(--font-ui); font-size:11.5px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
  padding:11px 15px 0;
}
.block > *:last-child{margin-bottom:0}

ol.steps{margin:8px 0 14px; padding:0 15px 0 34px; display:flex; flex-direction:column; gap:7px}
ol.steps li{font-size:14.5px; padding-left:3px}
ol.steps li::marker{font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:600}
ol.steps b{font-family:var(--font-mono); font-size:13px; background:var(--surface-2); padding:1px 5px; border-radius:var(--r-sm); font-weight:600}

/* expected-readings table: the heart of "what should I see" */
.expect-wrap{overflow-x:auto; margin:8px 0 0}
table.expect{width:100%; border-collapse:collapse; font-size:14px}
table.expect th{
  text-align:left; font-family:var(--font-ui); font-size:11px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  padding:6px 15px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.expect td{padding:9px 15px; border-bottom:1px solid var(--line); vertical-align:top}
table.expect tr:last-child td{border-bottom:0}
table.expect td.val{
  font-family:var(--font-mono); font-weight:600; font-size:13.5px;
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
td.val .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle}
.dot.good{background:var(--ok)} .dot.warn{background:var(--accent)} .dot.bad{background:var(--hazard)} .dot.neut{background:var(--ink-3)}

/* severity notes */
.note{display:flex; gap:10px; padding:11px 14px; border-radius:var(--r-lg); font-size:14px; line-height:1.5}
.note .ic{font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.08em; flex:0 0 auto; padding-top:1px}
.note.danger{background:var(--hazard-soft); color:var(--hazard); border:1px solid currentColor}
.note.danger strong{color:inherit}
.note.tip{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.note.tip .ic{color:var(--accent)}

/* ============================================================
   Browse / library
   ============================================================ */
.search{
  width:100%; padding:11px 14px; font:inherit; font-size:15px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r-md);
}
.search::placeholder{color:var(--ink-3)}
.grouphead{
  font-family:var(--font-ui); font-size:11.5px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); margin:6px 0 -4px;
  display:flex; align-items:center; gap:9px;
}
.grouphead::after{content:""; flex:1; height:1px; background:var(--line)}
.joblist{display:flex; flex-direction:column; gap:6px}
.job{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:10px 13px; cursor:pointer; transition:border-color .15s, transform .1s;
}
.job:hover{border-color:var(--accent)}
.job:active{transform:translateY(1px)}
.job[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.job .t{font-weight:500; font-size:14.5px; flex:1; min-width:0}
.job .d{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.empty{color:var(--ink-3); font-size:14px; padding:14px 2px}

/* ============================================================
   Ask Claude
   ============================================================ */
.ask-form{display:flex; gap:8px; align-items:flex-end}
.ask-form textarea{
  flex:1; font:inherit; font-size:15px; padding:10px 13px; resize:vertical; min-height:74px;
  background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r-md);
}
.btn{
  border:1px solid transparent; background:var(--accent); color:var(--on-accent);
  font-family:var(--font-ui); font-weight:700; font-size:15px; letter-spacing:.02em;
  padding:11px 18px; border-radius:var(--r-md); cursor:pointer; white-space:nowrap;
}
.btn:disabled{opacity:.5; cursor:default}
.btn.ghost{background:transparent; border-color:var(--line-2); color:var(--ink-2); font-size:13px; padding:7px 13px}
.suggest{display:flex; flex-wrap:wrap; gap:6px}
.thinking{color:var(--ink-2); font-size:14px; font-style:italic}
.answer{font-size:15px; line-height:1.6; max-width:64ch}
.askoff{
  background:var(--surface-2); border:1px dashed var(--line-2); border-radius:var(--r-lg);
  padding:16px; color:var(--ink-2); font-size:14px;
}
.footnote{color:var(--ink-3); font-size:12px; line-height:1.5; max-width:70ch}
.footnote a{color:var(--accent)}
</style>

<div class="app">
  <aside class="stage">
    <svg id="meter" viewBox="0 0 340 560" role="img" aria-labelledby="meterttl"><title id="meterttl">Performance Tool W2972 multimeter, showing the dial position and lead placement for the selected job</title></svg>
    <div class="setup" id="setup"></div>
    <p class="verdict neut" id="verdict"></p>
    <div class="fuses" id="fuses" hidden></div>
    <div class="bench">
      <label class="fld"><span>Probing</span><select id="subject"></select></label>
      <fieldset class="moving">
        <legend>Click a jack to move</legend>
        <label><input type="radio" name="moving" value="red" checked> Red</label>
        <label><input type="radio" name="moving" value="black"> Black</label>
      </fieldset>
    </div>
    <p class="hint">Turn the dial, move the leads, press POWER and HOLD. It reads what the real meter would &mdash; including the mistakes.</p>
    <div class="unverified" id="unverified" hidden></div>
  </aside>

  <main class="panel">
    <div class="masthead">
      <div>
        <div class="eyebrow">Performance Tool W2972</div>
        <h1>Where do the leads go?</h1>
        <p>Pick a job. The meter shows the setup; this side tells you what you should see.</p>
      </div>
      <button class="btn ghost" id="themebtn" type="button">Theme</button>
    </div>

    <div class="segmented" role="tablist">
      <button role="tab" id="tab-job" aria-selected="true" aria-controls="view-job">This job</button>
      <button role="tab" id="tab-browse" aria-selected="false" aria-controls="view-browse">Browse</button>
      <button role="tab" id="tab-ask" aria-selected="false" aria-controls="view-ask">Ask</button>
    </div>

    <section class="view" id="view-job" role="tabpanel" aria-labelledby="tab-job"></section>

    <section class="view" id="view-browse" role="tabpanel" aria-labelledby="tab-browse" hidden>
      <input class="search" id="search" type="search" placeholder="Search jobs - battery, dryer, continuity, fuse..." autocomplete="off">
      <div id="joblist"></div>
    </section>

    <section class="view" id="view-ask" role="tabpanel" aria-labelledby="tab-ask" hidden></section>
  </main>
</div>

<script>
"use strict";

/* ================================================================
   METER SPEC - the only thing that needs changing if the physical
   dial differs. Everything (artwork, chips, validation, the prompt
   sent to Claude) is generated from this object.
   ================================================================ */
const OHM = "\u03A9", MU = "\u00B5";

const METER = {
  model: "Performance Tool W2972",
  verified: false,
  unsure: ["dca20m","dca200m","acv200m"],
  cat: "CAT III 600V / CAT II 1000V",
  maxDCV: 1000, maxACV: 750,
  jacks: [
    { id:"A10",  label:"A",            sub:"10A MAX FUSED",    note:"High current only, up to 10 A. Fused. The meter must sit IN SERIES." },
    { id:"MA",   label:"mA",           sub:"200mA MAX FUSED",  note:"Small current, up to 200 mA. Fused. Also in series." },
    { id:"COM",  label:"COM",          sub:"",                 note:"Black lead lives here. Always. Every measurement." },
    { id:"VOHM", label:"V"+OHM+"\u21e5", sub:"CAT III 600V",  note:"Red lead for volts, ohms, continuity and diode." }
  ],
  /* Clockwise, read off the dial face. There is no OFF - power is a button. */
  dial: [
    { id:"diode",    label:"\u21e5\u00b7)))", group:"TEST", desc:"Diode test and continuity share one position. Beeps on a near-short; shows forward voltage on a diode." },
    { id:"ohm200",   label:"200",   group:"OHM", max:200,     desc:"Resistance up to 200 "+OHM+". Elements, coils, thermal fuses." },
    { id:"ohm2k",    label:"2k",    group:"OHM", max:2e3,     desc:"Resistance up to 2 k"+OHM+"." },
    { id:"ohm20k",   label:"20k",   group:"OHM", max:2e4,     desc:"Resistance up to 20 k"+OHM+"." },
    { id:"ohm200k",  label:"200k",  group:"OHM", max:2e5,     desc:"Resistance up to 200 k"+OHM+"." },
    { id:"ohm2m",    label:"2M",    group:"OHM", max:2e6,     desc:"Resistance up to 2 M"+OHM+"." },
    { id:"dca20m",   label:"20m",   group:"DCA", max:0.02,  jack:"MA",  desc:"DC current up to 20 mA. Red lead in the mA jack, meter in series." },
    { id:"dca200m",  label:"200m",  group:"DCA", max:0.2,   jack:"MA",  desc:"DC current up to 200 mA. Red lead in the mA jack, meter in series." },
    { id:"dcv2",     label:"2",     group:"DCV", max:2,       desc:"DC volts up to 2 V, resolving 1 mV. The voltage-drop range on this meter." },
    { id:"dcv20",    label:"20",    group:"DCV", max:20,      desc:"DC volts up to 20 V. The 12 V automotive range - the one you will use most." },
    { id:"dcv200",   label:"200",   group:"DCV", max:200,     desc:"DC volts up to 200 V." },
    { id:"dcv1000",  label:"1000",  group:"DCV", max:1000,    desc:"DC volts up to 1000 V. Start here on anything unknown." },
    { id:"acv750",   label:"750",   group:"ACV", max:750,     desc:"AC volts up to 750 V. The meter's AC ceiling - use it for 240 V." },
    { id:"acv200",   label:"200",   group:"ACV", max:200,     desc:"AC volts up to 200 V. The right range for a 120 V outlet." },
    { id:"acv20",    label:"20",    group:"ACV", max:20,      desc:"AC volts up to 20 V." },
    { id:"acv2",     label:"2",     group:"ACV", max:2,       desc:"AC volts up to 2 V." },
    { id:"acv200m",  label:"200m",  group:"ACV", max:0.2,     desc:"AC volts up to 200 mV." },
    { id:"dca10",    label:"10",    group:"DCA", max:10, jack:"A10", desc:"DC current up to 10 A. Red lead MUST move to the A jack. In series only." },
    { id:"dwell4",   label:"4CYL",  group:"DWELL", desc:"Dwell angle, 4 cylinder. Points ignition only." },
    { id:"dwell6",   label:"6CYL",  group:"DWELL", desc:"Dwell angle, 6 cylinder." },
    { id:"dwell8",   label:"8CYL",  group:"DWELL", desc:"Dwell angle, 8 cylinder." },
    { id:"rpm8",     label:"8CYL",  group:"RPM", desc:"Tachometer, 8 cylinder. Reading x 10 = engine RPM." },
    { id:"rpm6",     label:"6CYL",  group:"RPM", desc:"Tachometer, 6 cylinder. Reading x 10 = engine RPM." },
    { id:"rpm4",     label:"4CYL",  group:"RPM", desc:"Tachometer, 4 cylinder. Reading x 10 = engine RPM." }
  ]

/* ================================================================
   Seven-segment LCD. Inactive segments are drawn faintly, the way
   a real LCD shows its unlit ghosts.
   ================================================================ */
const SEGMAP = {
  "0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd",
  "6":"afgedc","7":"abc","8":"abcdefg","9":"abcfgd",
  "-":"g","O":"abcdef","L":"fed"," ":""
};
const DW = 40, DH = 70, DT = 8, DGAP = 12;

function segPoly(which){
  const t = DT, w = DW, h = DH, m = h/2;
  const hBar = y => `${t/2},${y} ${t},${y-t/2} ${w-t},${y-t/2} ${w-t/2},${y} ${w-t},${y+t/2} ${t},${y+t/2}`;
  const vBar = (x,y0,y1) => `${x},${y0+t/2} ${x+t/2},${y0+t} ${x+t/2},${y1-t} ${x},${y1-t/2} ${x-t/2},${y1-t} ${x-t/2},${y0+t}`;
  switch(which){
    case "a": return hBar(t/2);
    case "g": return hBar(m);
    case "d": return hBar(h-t/2);
    case "f": return vBar(t/2, t/2, m);
    case "b": return vBar(w-t/2, t/2, m);
    case "e": return vBar(t/2, m, h-t/2);
    case "c": return vBar(w-t/2, m, h-t/2);
  }
  return "";
}
const SEGS = ["a","b","c","d","e","f","g"];

/* Parse "12.62" / "OL" / "-0.05" into cells, decimals ride on the cell before. */
function lcdCells(str){
  const cells = [];
  for (const ch of String(str)){
    if (ch === "." || ch === ","){ if (cells.length) cells[cells.length-1].dp = true; continue; }
    cells.push({ ch: ch.toUpperCase(), dp:false });
  }
  return cells;
}
function renderLcd(str, unit){
  const cells = lcdCells(str);
  const totalW = cells.length * DW + Math.max(0, cells.length-1) * DGAP;
  const rightEdge = 302;                       // inside the LCD bezel
  let x = rightEdge - totalW;
  let out = "";
  for (const cell of cells){
    const on = SEGMAP[cell.ch] || "";
    out += `<g transform="translate(${x},116)">`;
    for (const s of SEGS){
      const cls = on.includes(s) ? "seg" : "seg off";
      out += `<polygon class="${cls}" points="${segPoly(s)}"></polygon>`;
    }
    if (cell.dp) out += `<circle class="seg" cx="${DW+DGAP/2-1}" cy="${DH-DT/2}" r="${DT/2}"></circle>`;
    out += `</g>`;
    x += DW + DGAP;
  }
  out += `<text x="${rightEdge+8}" y="234" class="lcd-unit">${esc(unit||"")}</text>`;
  return out;
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* 2000-count, 3.5 digit, formatted the way each range actually reads */
function formatRange(d, value){
  const m = d.max;
  if (d.group === "OHM"){
    if (m <= 200)  return { t: value.toFixed(1), u: OHM };
    if (m <= 2e3)  return { t: (value/1e3).toFixed(3), u: "k"+OHM };
    if (m <= 2e4)  return { t: (value/1e3).toFixed(2), u: "k"+OHM };
    if (m <= 2e5)  return { t: (value/1e3).toFixed(1), u: "k"+OHM };
    return { t: (value/1e6).toFixed(3), u: "M"+OHM };
  }
  if (d.group === "DCA"){
    if (m <= 0.02) return { t: (value*1e3).toFixed(2), u:"mA" };
    if (m <= 0.2)  return { t: (value*1e3).toFixed(1), u:"mA" };
    return { t: value.toFixed(2), u:"A" };
  }
  const unit = d.group === "ACV" ? "V AC" : "V DC";
  if (m <= 0.2) return { t: (value*1e3).toFixed(1), u:"mV" + (d.group === "ACV" ? " AC" : " DC") };
  if (m <= 2)   return { t: value.toFixed(3), u:unit };
  if (m <= 20)  return { t: value.toFixed(2), u:unit };
  if (m <= 200) return { t: value.toFixed(1), u:unit };
  return { t: pad(Math.round(value), 4), u:unit };
}

function simulate(st){
  const d = dialById(st.dial), sub = SUBJECTS.find(x => x.id === st.subject) || SUBJECTS[0];
  const out = { reading:"", unit:"", verdict:"", tone:"neut", blows:null };
  if (!st.power) return { ...out, reading:"", unit:"", verdict:"Meter is off. Press POWER.", tone:"neut", off:true };
  if (st.black !== "COM") out.warn = "Black lead is not in COM. It belongs there for every measurement.";

  const G = d.group;

  if (G === "RPM" || G === "DWELL"){
    return { ...out, reading:"---", unit:G === "RPM" ? "x10" : "deg",
      verdict:"Needs the engine running with the inductive pickup clipped round a plug wire. Nothing to read from the probes alone.", tone:"neut" };
  }

  if (G === "DCA"){
    const wantJack = d.jack;                       // A10 for the 10 range, MA for 20m/200m
    const fuseOk = wantJack === "A10" ? st.fuseA : st.fuseMA;
    if (st.red !== wantJack){
      return { ...out, reading:"0.00", unit:"",
        verdict:`No current path - the red lead is in ${jackById(st.red).label}, but this range reads through the ${jackById(wantJack).label} jack.`, tone:"warn" };
    }
    if (sub.kind === "dc" || sub.kind === "ac"){
      return { ...out, reading:"0.00", unit:"", blows:wantJack, tone:"bad",
        verdict:"SHORT CIRCUIT. You put a current range straight across a voltage source. On the real meter that is a bang, a spark and a blown fuse." };
    }
    if (!fuseOk) return { ...out, reading:"0.00", unit:"", tone:"bad",
      verdict:`The ${jackById(wantJack).label} fuse is blown. Current reads zero no matter what - which looks exactly like a dead circuit.` };
    if (sub.kind !== "i") return { ...out, reading:"0.00", unit:"", tone:"neut",
      verdict:"Nothing flowing. Current only reads when the meter is wired in series and the circuit is complete." };
    if (sub.a > d.max) return { ...out, reading:"OL", unit:"", tone:"bad",
      verdict:`Over range - more than ${d.label === "10" ? "10 A" : d.label + "A"}. Move up, or you will blow the fuse.` };
    const f = formatRange(d, sub.a);
    return { ...out, reading:f.t, unit:f.u, tone:"good", verdict:"Measuring in series. Move the red lead back when you finish." };
  }

  if (G === "OHM" || G === "TEST"){
    if (sub.kind === "dc" || (sub.kind === "ac" && sub.v > 0)){
      return { ...out, reading:"OL", unit:"", tone:"bad",
        verdict:"Never measure resistance or continuity on a live circuit. The number is meaningless and you can damage the meter." };
    }
    if (G === "TEST"){
      if (sub.kind === "diode") return sub.vf === Infinity
        ? { ...out, reading:"OL", unit:"", tone:"good", verdict:"Reverse direction - no conduction. Correct for a healthy diode." }
        : { ...out, reading:sub.vf.toFixed(3), unit:"V", tone:"good", verdict:"Forward voltage drop. 0.5 - 0.7 V is a healthy silicon diode." };
      if (sub.kind === "r"){
        if (sub.r < 30) return { ...out, reading:sub.r.toFixed(1), unit:"BEEP", tone:"good", beep:true, verdict:"Continuous - the buzzer sounds under roughly 30 ohms." };
        return { ...out, reading:"OL", unit:"", tone:"bad", verdict:"Open. No continuous path." };
      }
      return { ...out, reading:"OL", unit:"", tone:"neut", verdict:"Open probes." };
    }
    if (sub.kind !== "r") return { ...out, reading:"OL", unit:"", tone:"neut", verdict:"Nothing across the probes." };
    if (sub.r > d.max) return { ...out, reading:"OL", unit:"", tone:"warn",
      verdict:`Over range for the ${d.label} position. Move up a range - or it really is open.` };
    const f = formatRange(d, sub.r);
    return { ...out, reading:f.t, unit:f.u, tone:"good",
      verdict: d.max/sub.r > 100 ? "Reading, but ranged high - drop a range for more decimals." : "Good reading, correctly ranged." };
  }

  // voltage
  const isDC = G === "DCV";
  const matches = (isDC && sub.kind === "dc") || (!isDC && sub.kind === "ac");
  if (sub.kind === "r" || sub.kind === "diode" || sub.kind === "open" || sub.kind === "i"){
    return { ...out, reading: isDC ? "00.00" : "000.0", unit:isDC ? "V DC" : "V AC", tone:"neut",
      verdict:"No voltage present. That is what a passive component or an open probe reads." };
  }
  if (!matches){
    return { ...out, reading: isDC ? "00.01" : "000.2", unit:isDC ? "V DC" : "V AC", tone:"warn",
      verdict: isDC ? "Wandering near zero - this is AC and you are on a DC range. A suspiciously small number is usually the wrong function, not a dead circuit."
                    : "Wandering near zero - this is DC and you are on an AC range. Switch function before you conclude anything." };
  }
  if (sub.v > d.max) return { ...out, reading:"OL", unit:"", tone:"warn",
    verdict:`Over range. ${d.label} is the maximum this position reads - move up.` };
  const f = formatRange(d, sub.v);
  const headroom = d.max / Math.max(sub.v, 1e-9);
  return { ...out, reading:f.t, unit:f.u, tone: headroom > 20 ? "warn" : "good",
    verdict: headroom > 20 ? "Correct function, but ranged too high - you are losing decimal places. Drop a range."
                           : "Correctly ranged. This is the reading you want." };
}


/* ================================================================
   Driving the instrument
   ================================================================ */
const DOT = {good:"good", warn:"warn", bad:"bad", neut:"neut"};
let current = null;

function dialById(id){ return METER.dial.find(d => d.id === id) || METER.dial[0]; }
function jackById(id){ return METER.jacks.find(j => j.id === id) || METER.jacks[2]; }

function render(){
  const st = bench, d = dialById(st.dial);
  const res = simulate(st);

  document.getElementById("knob").style.transform = `rotate(${angleOf(d.id).toFixed(2)}deg)`;
  if (res.blows){
    if (res.blows === "A10") st.fuseA = false; else st.fuseMA = false;
  }
  const shown = (st.hold && st.held) ? st.held : res;
  if (st.hold && !st.held) st.held = res;
  document.getElementById("lcd").innerHTML = res.off ? "" : renderLcd(shown.reading, shown.unit);
  drawLeads(st.red, st.black);

  document.querySelectorAll("[data-ring]").forEach(r =>
    r.classList.toggle("on", r.dataset.ring === st.red || r.dataset.ring === st.black));
  document.querySelectorAll("[data-lab]").forEach(t => t.classList.toggle("hot", t.dataset.lab === d.id));
  document.querySelectorAll("[data-tick]").forEach(t => t.classList.toggle("hot", t.dataset.tick === d.id));
  document.getElementById("btnHold").classList.toggle("active", st.hold);
  document.getElementById("btnPower").classList.toggle("active", st.power);

  const gname = { DCV:"V", ACV:"V~", DCA:"A", OHM:OHM, DWELL:"DWELL", RPM:"RPMX10", TEST:"" }[d.group] || "";
  document.getElementById("setup").innerHTML = `
    <span class="chip dial">Dial <b>${esc((gname ? gname + " " : "") + d.label)}</b></span>
    <span class="chip red">Red <b>${esc(jackById(st.red).label)}</b></span>
    <span class="chip blk">Black <b>${esc(jackById(st.black).label)}</b></span>
    ${st.hold ? '<span class="chip">HOLD</span>' : ""}`;

  const v = document.getElementById("verdict");
  v.className = "verdict " + (res.tone || "neut");
  v.innerHTML = esc(res.verdict) + (res.warn ? " <em>" + esc(res.warn) + "</em>" : "");

  const fz = document.getElementById("fuses");
  const blown = [!st.fuseA && "A (10 A)", !st.fuseMA && "mA (200 mA)"].filter(Boolean);
  fz.hidden = !blown.length;
  if (blown.length) fz.innerHTML =
    `<strong>Fuse blown: ${esc(blown.join(" and "))}.</strong> Every current reading is now a false zero.
     <button class="btn ghost" id="refuse" type="button">Replace fuse</button>`;
}

/* set the meter from a scenario, then let him fiddle with it */
function applySetup(s){
  bench.dial  = dialById(s.dial).id;
  bench.red   = METER.jacks.some(j => j.id === s.red) ? s.red : "VOHM";
  bench.black = "COM";
  bench.power = true; bench.hold = false; bench.held = null;
  if (s.subject) bench.subject = s.subject;
  const sel = document.getElementById("subject");
  if (sel) sel.value = bench.subject;
  render();
}

function onMeterClick(e){
  const hit = e.target.closest(".hit");
  if (!hit) return;
  const st = bench;
  if (hit.id === "btnPower"){ st.power = !st.power; st.hold = false; st.held = null; }
  else if (hit.id === "btnHold"){ st.hold = !st.hold; st.held = null; }
  else if (hit.dataset.pos){ st.dial = hit.dataset.pos; st.held = null; }
  else if (hit.dataset.jack){
    const moving = document.querySelector('input[name="moving"]:checked').value;
    if (moving === "red") st.red = hit.dataset.jack; else st.black = hit.dataset.jack;
    st.held = null;
  }
  render();
}


/* ================================================================
   The briefing panel
   ================================================================ */
function briefHtml(s, opts){
  const d = dialById(s.dial);
  let h = `<div class="brief-head">
      <div class="eyebrow">${esc((GROUPS.find(g => g.id === s.g) || {}).name || (opts && opts.eyebrow) || "Answer")}</div>
      <h2>${esc(s.title)}</h2>
      ${s.why ? `<p class="why">${s.why}</p>` : ""}
    </div>`;

  if (d) h += `<div class="note tip"><span class="ic">DIAL</span><div><b>${esc(d.group === "OFF" ? d.label : d.group + " " + d.label)}</b> &mdash; ${esc(d.desc)}</div></div>`;

  if (s.danger) h += `<div class="note danger"><span class="ic">DANGER</span><div>${s.danger}</div></div>`;

  if (s.steps && s.steps.length){
    h += `<div class="block"><h3>How to set it up</h3><ol class="steps">${
      s.steps.map(x => `<li>${x}</li>`).join("")}</ol></div>`;
  }
  if (s.expect && s.expect.length){
    h += `<div class="block"><h3>What you should see</h3><div class="expect-wrap"><table class="expect">
      <thead><tr><th>Reading</th><th>What it means</th></tr></thead><tbody>${
      s.expect.map(e => `<tr><td class="val"><span class="dot ${DOT[e.s] || "neut"}"></span>${esc(e.v)}</td><td>${esc(e.m)}</td></tr>`).join("")
      }</tbody></table></div></div>`;
  }
  if (s.gotcha) h += `<div class="note tip"><span class="ic">WATCH</span><div>${s.gotcha}</div></div>`;
  return h;
}

function select(s, opts){
  current = s;
  applySetup(s);
  document.getElementById("view-job").innerHTML = briefHtml(s, opts);
  document.querySelectorAll(".job").forEach(b => b.setAttribute("aria-current", String(b.dataset.id === s.id)));
  showTab("job");
  if (opts && opts.scroll) document.getElementById("view-job").scrollIntoView({block:"nearest"});
}

/* ================================================================
   Tabs, browse, search
   ================================================================ */
function showTab(name){
  ["job","browse","ask"].forEach(n => {
    document.getElementById("tab-" + n).setAttribute("aria-selected", String(n === name));
    document.getElementById("view-" + n).hidden = (n !== name);
  });
}
["job","browse","ask"].forEach(n => {
  document.getElementById("tab-" + n).addEventListener("click", () => showTab(n));
});

function renderList(q){
  const needle = (q || "").trim().toLowerCase();
  const hit = s => !needle ||
    (s.title + " " + (s.why||"") + " " + s.g + " " + (s.steps||[]).join(" ")).toLowerCase().includes(needle);
  const box = document.getElementById("joblist");
  let h = "", any = false;
  for (const g of GROUPS){
    const items = SCENARIOS.filter(s => s.g === g.id && hit(s));
    if (!items.length) continue;
    any = true;
    h += `<div class="grouphead">${esc(g.name)}</div><div class="joblist">${
      items.map(s => {
        const d = dialById(s.dial);
        return `<button class="job" type="button" data-id="${esc(s.id)}">
          <span class="t">${esc(s.title)}</span>
          <span class="d">${esc(d ? (d.group === "OFF" ? d.label : d.group + " " + d.label) : "")}</span>
        </button>`;
      }).join("")}</div>`;
  }
  box.innerHTML = any ? h : `<p class="empty">Nothing matches &ldquo;${esc(q)}&rdquo;. Try the Ask tab &mdash; it can answer things the library does not cover.</p>`;
  box.querySelectorAll(".job").forEach(b => {
    b.addEventListener("click", () => select(SCENARIOS.find(s => s.id === b.dataset.id), {scroll:true}));
  });
}
document.getElementById("search").addEventListener("input", e => renderList(e.target.value));

/* ================================================================
   Ask Claude - free text in, the same instrument setup out.
   Absent (opened as a local file, or not granted) => the library
   still works untouched.
   ================================================================ */
const VALID_DIALS = METER.dial.map(d => `${d.id} (${d.group} ${d.label})`).join(", ");
const VALID_JACKS = METER.jacks.map(j => `${j.id} (${j.label}${j.sub ? " - " + j.sub : ""})`).join(", ");

function askPrompt(question){
  return [
    `You are coaching someone through using a ${METER.model} multimeter, a MANUAL-RANGING automotive DMM rated ${METER.cat} (1000 V DC / 750 V AC maximum).`,
    `They are a competent DIYer who is new to multimeters. Be concrete and safety-first. Never invent a capability the meter does not have.`,
    ``,
    `Valid dial ids: ${VALID_DIALS}`,
    `Valid jack ids: ${VALID_JACKS}. The black lead is ALWAYS COM. There is no OFF position - power is a button.`,
    ``,
    `Answer their question with JSON only, this exact shape:`,
    `{"title":"short job name","why":"1-2 sentences on what this measurement tells them",`,
    `"dial":"<a valid dial id>","red":"<a valid jack id>","black":"COM",`,
    `"reading":"a plausible display string, digits only e.g. 12.62 or OL","unit":"e.g. V DC",`,
    `"steps":["setup step",...],"expect":[{"v":"a reading","s":"good|warn|bad|neut","m":"what it means"},...],`,
    `"danger":"only if there is a real hazard, else null","gotcha":"the mistake people make here, else null"}`,
    ``,
    `Pick the SMALLEST dial range above the expected value. If current is involved, red must be A10 (the 10 range) or MA (the 20m/200m ranges), and you must warn that the meter goes in series. If it is a mains question, include a danger note.`,
    ``,
    `Question: ${question}`
  ].join("\n");
}

function normalise(o, question){
  const s = {
    id: "__ask__",
    g: null,
    title: o && o.title ? String(o.title) : question.slice(0, 70),
    why: o && o.why ? esc(String(o.why)) : "",
    dial: o && dialById(o.dial) ? o.dial : "dcv20",
    red:  o && METER.jacks.some(j => j.id === o.red) ? o.red : "VOHM",
    black:"COM",
    reading: o && o.reading != null ? String(o.reading).slice(0, 6) : "OL",
    unit: o && o.unit ? String(o.unit).slice(0, 8) : "",
    steps: Array.isArray(o && o.steps) ? o.steps.slice(0, 8).map(x => esc(String(x))) : [],
    expect: Array.isArray(o && o.expect) ? o.expect.slice(0, 8).map(e => ({
      v: String(e && e.v || ""), s: DOT[e && e.s] || "neut", m: String(e && e.m || "")
    })) : [],
    danger: o && o.danger ? esc(String(o.danger)) : null,
    gotcha: o && o.gotcha ? esc(String(o.gotcha)) : null
  };
  return s;
}

const SUGGESTIONS = [
  "How do I check if my extension cord is bad?",
  "Testing a thermocouple on a water heater",
  "Is my trailer's 7-pin connector wired right?",
  "How do I measure current draw on an LED strip?"
];

async function initAsk(){
  const view = document.getElementById("view-ask");
  const sample = (window.claude && window.claude.use) ? await window.claude.use("sample").catch(() => null) : null;

  if (!sample){
    view.innerHTML = `<div class="askoff">
      <strong>Ask is not available in this copy.</strong><br>
      This is the offline build &mdash; the ${SCENARIOS.length} jobs under <b>Browse</b> all work with no network and no account,
      which is the point of keeping a local copy in the garage. Open the published version on your phone to ask free-text questions.
    </div>`;
    return;
  }

  view.innerHTML = `
    <div class="ask-form">
      <textarea id="q" placeholder="What are you trying to measure? e.g. &ldquo;how do I test the igniter on a gas dryer?&rdquo;"></textarea>
      <button class="btn" id="askbtn" type="button">Ask</button>
    </div>
    <div class="suggest" id="suggest">${SUGGESTIONS.map(t => `<button class="btn ghost" type="button" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div id="askout"></div>
    <p class="footnote">Answers set the meter on the left the same way the library does. Claude can be wrong &mdash; on anything mains-voltage, trust the manual and the library entries over a generated answer.</p>`;

  const q = document.getElementById("q"), btn = document.getElementById("askbtn"), out = document.getElementById("askout");

  async function run(text){
    if (!text.trim()) return;
    btn.disabled = true;
    out.innerHTML = `<p class="thinking">Working out the setup&hellip;</p>`;
    try{
      const res = await sample.json(askPrompt(text.trim()), { modelTier:"default" });
      const s = normalise(res, text.trim());
      current = s;
      applySetup(s);
      out.innerHTML = briefHtml(s, { eyebrow:"Asked Claude" });
    }catch(err){
      const code = err && err.code;
      out.innerHTML = `<div class="note danger"><span class="ic">ERROR</span><div>${
        code === "rate_limited" ? "Too many questions too quickly. Wait a moment and ask again." :
        code === "not_granted"  ? "This page is not allowed to ask Claude. The Browse library still works." :
        "That did not come back. Try rewording the question, or check Browse for a similar job."
      }</div></div>`;
    }finally{ btn.disabled = false; }
  }
  btn.addEventListener("click", () => run(q.value));
  q.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(q.value); });
  document.getElementById("suggest").addEventListener("click", e => {
    const b = e.target.closest("[data-q]");
    if (b){ q.value = b.dataset.q; run(b.dataset.q); }
  });
}

/* ================================================================
   Theme toggle + boot
   ================================================================ */
document.getElementById("themebtn").addEventListener("click", () => {
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

buildMeter();
(function initBench(){
  const sel = document.getElementById("subject");
  sel.innerHTML = SUBJECTS.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
  sel.addEventListener("change", e => { bench.subject = e.target.value; bench.held = null; render(); });
  document.querySelectorAll('input[name="moving"]').forEach(r => r.addEventListener("change", render));
  document.getElementById("fuses").addEventListener("click", e => {
    if (e.target.id === "refuse"){ bench.fuseA = true; bench.fuseMA = true; bench.held = null; render(); }
  });
})();
renderList("");
if (!METER.verified){
  const u = document.getElementById("unverified");
  u.hidden = false;
  u.innerHTML = "Traced from the Menards product photo, not yet confirmed against the meter in hand. Three positions are still uncertain &mdash; the <b>20m</b>/<b>200m</b> pair and the <b>200m</b> on the V~ side. Check the real dial before trusting a position.";
}
select(SCENARIOS[0]);
initAsk();
</script>
